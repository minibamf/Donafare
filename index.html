<style>
  :root{
    --cream:#F7EFDF; --cream-deep:#EDE0C8; --paper:#FFFCF6;
    --ink:#2E2A24; --ink-soft:#5B5346;
    --sun:#FFC93C; --sun-deep:#E39400;
    --lilac:#B7A4E8; --lilac-deep:#7C63CE;
    --sky:#7FCBEA; --sky-deep:#2E8FB8;
    --coral:#FF95A0; --coral-deep:#E85868;
    --mint:#6FC29B;
    --plum:#241D38; --plum-card:#352A52; --plum-text:#F3EEFF; --plum-soft:#C6B8EC;
    --line: rgba(46,42,36,0.12);
    --shadow: 0 20px 44px -18px rgba(46,42,36,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(46,42,36,0.05) 1.4px, transparent 0) 0 0/22px 22px,
      radial-gradient(900px 500px at 15% -10%, #FFF6E3 0%, transparent 60%),
      radial-gradient(800px 420px at 95% 6%, #EDE3FA 0%, transparent 55%),
      var(--cream);
    font-family:'Vazirmatn', sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:18px;
  }
  h1,h2,h3,.display{ font-family:'Lalezar','Vazirmatn',sans-serif; font-weight:400; letter-spacing:.3px; }

  #shell{
    width:100%; max-width:400px; height:min(844px, 92vh);
    background:var(--paper); border-radius:36px; box-shadow:var(--shadow);
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  #app{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; -webkit-overflow-scrolling:touch; }
  #app::-webkit-scrollbar{width:0;}

  .view{ min-height:100%; padding:22px 20px 100px; display:flex; flex-direction:column; animation:slideIn .38s cubic-bezier(.22,1,.36,1); }
  @keyframes slideIn{ from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);} }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes dashMove{ to{ stroke-dashoffset:-40; } }
  @keyframes glowPulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  @keyframes popIn{ 0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.1);} 100%{transform:scale(1); opacity:1;} }

  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .backbtn{ width:36px;height:36px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--ink); flex-shrink:0; }
  .topbar-title{ font-size:15px; font-weight:700; color:var(--ink); flex:1; }

  .eyebrow{ font-size:11.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.4px; margin-bottom:4px; }
  .h1{ font-size:26px; margin:0 0 6px; color:var(--ink); }
  .h2{ font-size:20px; margin:0 0 4px; color:var(--ink); }
  .p{ font-size:13px; color:var(--ink-soft); line-height:1.8; margin:0 0 14px; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 18px; border-radius:999px; font-weight:700; font-size:14px; border:none; cursor:pointer; font-family:'Vazirmatn'; width:100%; transition:transform .12s ease; }
  .btn:active{ transform:scale(.96); }
  .btn.primary{ background:var(--ink); color:var(--cream); }
  .btn.sun{ background:var(--sun); color:var(--ink); box-shadow:0 6px 0 0 var(--sun-deep); }
  .btn.sun:active{ box-shadow:0 2px 0 0 var(--sun-deep); transform:translateY(4px) scale(.98); }
  .btn.lilac{ background:var(--lilac); color:#fff; box-shadow:0 6px 0 0 var(--lilac-deep); }
  .btn.lilac:active{ box-shadow:0 2px 0 0 var(--lilac-deep); transform:translateY(4px) scale(.98); }
  .btn.sky{ background:var(--sky); color:#0c3a4c; box-shadow:0 6px 0 0 var(--sky-deep); }
  .btn.sky:active{ box-shadow:0 2px 0 0 var(--sky-deep); transform:translateY(4px) scale(.98); }
  .btn.ghost{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line); }
  .btn.sm{ padding:10px 14px; font-size:12.5px; width:auto; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .row2{ display:flex; gap:10px; }

  .card{ background:var(--paper); border-radius:20px; padding:16px; box-shadow:0 10px 24px -14px rgba(46,42,36,0.28); }

  .chip{ background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:13px 12px; font-size:13px; font-weight:600; text-align:center; cursor:pointer; color:var(--ink); transition:transform .12s ease; }
  .chip:active{ transform:scale(.95); }
  .chip.on{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .chip-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .washi{ position:absolute; width:56px; height:18px; opacity:.9; border-radius:2px; box-shadow:0 3px 6px rgba(0,0,0,.12); background:repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 6px, rgba(255,255,255,.15) 6px 12px), var(--coral); }
  .sparkle{ position:absolute; font-size:14px; opacity:.85; pointer-events:none; }

  .paper-stack{ position:relative; margin:8px 0 4px; }
  .paper-stack::before{ content:''; position:absolute; inset:8px -8px -10px 8px; background:var(--sun); border-radius:20px; z-index:0; transform:rotate(-3deg); }
  .paper-stack .front{ position:relative; z-index:1; }

  .logo-badge{ width:104px;height:104px;border-radius:50%; object-fit:cover; box-shadow:0 10px 22px -8px rgba(0,0,0,.4); border:4px solid #fff; margin:0 auto 12px; display:block; }
  .logo-badge-sm{ width:100%;height:100%;object-fit:cover;border-radius:12px; }
  .slot-icon{ width:46px !important; height:46px !important; }

  .path-wrap{ position:relative; margin:6px 0 10px; }
  .node-label{ font-family:'Vazirmatn'; font-size:9.5px; font-weight:700; fill:var(--ink-soft); }

  .slot{ display:flex; align-items:center; gap:12px; padding:13px; border-radius:18px; background:var(--paper); margin-bottom:10px; cursor:pointer; box-shadow:0 8px 18px -12px rgba(46,42,36,.25); transition:transform .12s ease; }
  .slot:active{ transform:scale(.98); }
  .slot.empty{ background:transparent; border:1.6px dashed var(--line); box-shadow:none; }
  .slot-icon{ width:38px;height:38px;border-radius:12px; display:flex;align-items:center;justify-content:center; font-size:18px; flex-shrink:0; overflow:hidden; }
  .slot-body{ flex:1; min-width:0; }
  .slot-title{ font-size:13px; font-weight:700; color:var(--ink); }
  .slot-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot-check{ font-size:16px; flex-shrink:0; }

  input[type=text]{ width:100%; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-family:'Vazirmatn'; font-size:13px; background:var(--paper); color:var(--ink); }
  input[type=text]:focus{ outline:2px solid var(--sun-deep); outline-offset:1px; }

  .progress-track{ height:7px; background:var(--cream-deep); border-radius:4px; overflow:hidden; margin:8px 0 16px; }
  .progress-fill{ height:100%; background:var(--sun); border-radius:4px; transition:width .5s ease; }

  .blob-wrap{ display:flex; justify-content:center; margin:8px 0; animation:floaty 3.4s ease-in-out infinite; }

  .stars{ display:flex; gap:10px; justify-content:center; margin:18px 0; }
  .star{ font-size:40px; cursor:pointer; filter:grayscale(1) opacity(.35); transition:transform .15s ease, filter .15s ease; }
  .star.on{ filter:none; transform:scale(1.12); }

  #toast{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--cream); padding:10px 20px; border-radius:999px; font-size:12.5px; font-weight:600; opacity:0; transition:all .3s ease; pointer-events:none; z-index:50; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #confetti-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:40; }
  .confetti-piece{ position:absolute; top:-10px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(720px) rotate(600deg); opacity:0; } }

  .topcontrols{ position:absolute; top:14px; left:14px; z-index:30; display:flex; gap:6px; }
  .miniicon{ width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);backdrop-filter:blur(4px); display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid var(--line); }

  .photo-frame{ background:#fff; padding:10px 10px 24px; border-radius:8px; box-shadow:0 14px 26px -12px rgba(0,0,0,.35); transform:rotate(-2deg); margin:14px auto; width:220px; }
  .photo-frame img{ width:100%; height:190px; object-fit:cover; border-radius:2px; display:block; }
  .photo-placeholder{ width:100%; height:190px; border-radius:2px; background:var(--cream-deep); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:12px; }

  .polaroid{ background:#fff; padding:14px 14px 20px; border-radius:6px; box-shadow:0 18px 32px -14px rgba(0,0,0,.4); width:270px; animation:popIn .35s cubic-bezier(.22,1,.36,1); }
  .polaroid-photo{ width:100%; height:270px; border-radius:2px; overflow:hidden; background:var(--cream-deep); }
  .polaroid-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .polaroid-caption{ padding-top:12px; text-align:center; }
  .dots{ display:flex; gap:5px; justify-content:center; margin-top:12px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--line); }
  .dot.on{ background:var(--sun-deep); width:16px; border-radius:3px; }

  ::selection{ background:var(--sun); color:var(--ink); }
</style>
</head>

let state = {
  view:'splash', history:[], week:{}, soundOn:true, musicOn:false, quiz:null, albumAnswer:null,
};
DAYS.forEach(d=>{ state.week[d] = { breakfast:null, lunch:null, dinner:null, activity:null }; });

/* ================= PERSISTENCE ================= */
async function loadState(){
  try{
    const raw = localStorage.getItem('donafare-week-data');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.__days && Array.isArray(parsed.__days)){
        parsed.__days.forEach(d=>{ if(!DAYS.includes(d)) DAYS.push(d); });
      }
      DAYS.forEach(d=>{ if(parsed[d]) state.week[d] = parsed[d]; else if(!state.week[d]) state.week[d] = {breakfast:null,lunch:null,dinner:null,activity:null}; });
    }
  }catch(e){ console.error('load failed', e); }
  render();
}
async function saveWeek(){
  try{
    const payload = Object.assign({}, state.week, {__days: DAYS});
    localStorage.setItem('donafare-week-data', JSON.stringify(payload));
  }
  catch(e){ console.error('save failed', e); toast('حافظه‌ی گوشی پره، یه چندتا عکس قدیمی رو پاک کن 😕'); }
}
function addExtraDay(){
  if(DAYS.length>=8){ toast('فقط یه روز اضافه می‌تونی اضافه کنی'); return; }
  const name = prompt('اسم این روز آخر رو چی بذاریم؟ (مثلاً «روز خداحافظی»)');
  if(!name || !name.trim()) return;
  const trimmed = name.trim();
  DAYS.push(trimmed);
  state.week[trimmed] = { breakfast:null, lunch:null, dinner:null, activity:null };
  saveWeek();
  playConfirm();
  render();
}

/* ================= AUDIO ================= */
let actx = null;
function ctx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function tone(freq, dur, type, vol, delay){
  if(!state.soundOn) return;
  try{
    const c = ctx();
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(c.destination);
    const t0 = c.currentTime + (delay||0);
    g.gain.linearRampToValueAtTime(vol||0.05, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}

/* ================= IMAGE HANDLING ================= */
function handlePhoto(inputEl){
  const files = Array.from(inputEl.files||[]);
  if(!files.length) return;
  if(!state.quiz.photos) state.quiz.photos = [];
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        const w = img.width*scale, h = img.height*scale;
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const cctx = canvas.getContext('2d');
        cctx.drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        state.quiz.photos.push(dataUrl);
        playShutter();
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  inputEl.value = '';
}

  playClick();
  state.quiz.photos.splice(idx,1);
  render();

  let pathD = `M${pts[0].x} ${pts[0].y}`;

function tapSlot(day, slotKey){
  const existing = state.week[day][slotKey];
  if(existing && existing.status==='done'){
    if(confirm('این تسک تکمیل شده. می‌خوای پاکش کنی و از اول تصمیم بگیری؟')){

        <button class="btn ghost" onclick="pickBreakfastHome()">🏠 خونه — ثابت و راحت</button>
        <button class="btn ghost" onclick="pickBreakfastOutStart()">🚗 بیرون می‌ریم</button>
      </div>`;
  }
  if(q.step===1){
    return `<div class="h2">کجایی‌تر باشه بهتره؟</div>
      <p class="p">یکی رو انتخاب کن</p>
      <div class="chip-grid">
        <div class="chip ${q.category==='breakfast'?'on':''}" onclick="setBfCategory('breakfast')">🥐 صبحونه‌فروشی</div>
        <div class="chip ${q.category==='cafe'?'on':''}" onclick="setBfCategory('cafe')">☕ کافه</div>
      </div>
      <div style="flex:1;"></div>
      <button class="btn primary" ${!q.category?'disabled':''} onclick="goStep(2)">بعدی</button>`;
  }
  if(q.step===2) return suggestionCard();
}
function pickBreakfastHome(){
  const q = state.quiz;
  q.branch='home'; q.category=null; q.itemIndex=0;
  q.label = 'صبحونه‌ی خونگی'; q.emoji = '☀️'; q.logo=null;
  nav('predict');
}
function pickBreakfastOutStart(){ state.quiz.branch='out'; goStep(1); }
function setBfCategory(cat){ playClick(); state.quiz.category=cat; state.quiz.itemIndex = Math.floor(Math.random()*CATS[cat].items.length); render(); }

/* ---- lunch/dinner ---- */
function mealStep(){
  const q = state.quiz;
  if(q.step===0){
    return `<div class="blob-wrap">${blobPerso(80,'normal')}</div>
      <div class="h2" style="text-align:center;">خونه می‌مونیم یا بیرون؟</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <button class="btn ghost" onclick="pickMealHome()">🏠 خونه — می‌پزیم</button>
        <button class="btn ghost" onclick="pickMealOut()">🚗 می‌زنیم بیرون</button>
      </div>`;
  }
  if(q.step===1 && q.branch==='home'){
    return `<div class="h2">امروز حس آشپزی داریم یا سریع؟</div>
      <div class="chip-grid">
        <div class="chip ${q.mood==='slow'?'on':''}" onclick="setMood('slow')">🐌 با حوصله</div>
        <div class="chip ${q.mood==='fast'?'on':''}" onclick="setMood('fast')">⚡ سریع و ساده</div>
      </div>
      <div style="margin-top:18px;">
        <div class="p" style="margin-bottom:8px;">چی دوست داری بپزیم؟</div>
        <input type="text" id="dishInput" placeholder="مثلاً: کوکو سبزی" value="${q.dish||''}" oninput="state.quiz.dish=this.value">
      </div>
      <div style="flex:1;"></div>
      <button class="btn primary" onclick="confirmHomeMeal()">همینه ✓</button>`;
  }
  if(q.step===1 && q.branch==='out'){
    return `<div class="h2">امروز هوس چی داریم؟</div>
      <div class="chip-grid">
        ${OUT_FOOD_CATS.map(c=>`<div class="chip ${q.category===c?'on':''}" onclick="setMealCategory('${c}')">${CATS[c].emoji} ${CATS[c].label}</div>`).join('')}
      </div>`;
  }
  if(q.step===2) return suggestionCard();
}
function pickMealHome(){ playClick(); state.quiz.branch='home'; goStep(1); }
function pickMealOut(){ playClick(); state.quiz.branch='out'; goStep(1); }
function setMood(m){ playClick(); state.quiz.mood=m; render(); }
function setMealCategory(cat){
  playClick(); state.quiz.category = cat;
  state.quiz.itemIndex = Math.floor(Math.random()*CATS[cat].items.length);
  goStep(2);
}
function confirmHomeMeal(){
  const q = state.quiz;
  if(!q.dish || !q.dish.trim()){ toast('یه اسم غذا بنویس 🙂'); return; }
  q.label = q.dish.trim(); q.emoji = '🍳'; q.logo=null;
  playConfirm();
  nav('predict');
}

/* ---- activity ---- */
function activityStep(){
  const q = state.quiz;
  if(q.step===0){
    return `<div class="blob-wrap">${blobTiko(80,'normal')}</div>
      <div class="h2" style="text-align:center;">امشب می‌مونیم و بازی/فیلم یا می‌زنیم بیرون؟</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <button class="btn ghost" onclick="pickActivityStay()">🎲 می‌مونیم خونه</button>
        <button class="btn ghost" onclick="pickActivityOut()">☕ می‌ریم کافه</button>
      </div>`;
  }
  if(q.step===1 && q.branch==='stay'){
    return `<div class="h2">الان چه حالی داریم؟</div>
      <div class="chip-grid">
        <div class="chip ${q.mood==='calm'?'on':''}" onclick="setActMood('calm')">😌 آروم</div>
        <div class="chip ${q.mood==='energetic'?'on':''}" onclick="setActMood('energetic')">🤩 پرانرژی</div>
        <div class="chip ${q.mood==='competitive'?'on':''}" onclick="setActMood('competitive')">🔥 رقابتی</div>
        <div class="chip ${q.mood==='lazy'?'on':''}" onclick="setActMood('lazy')">😴 تنبل</div>
      </div>
      <div style="flex:1;"></div>
      <button class="btn primary" ${!q.mood?'disabled':''} onclick="pickActivityList()">بعدی</button>`;
  }
  if(q.step===2) return suggestionCard();
}
function pickActivityStay(){ playClick(); state.quiz.branch='stay'; goStep(1); }
function pickActivityOut(){
  playClick(); state.quiz.branch='out'; state.quiz.category='cafe';
  state.quiz.itemIndex = Math.floor(Math.random()*CATS.cafe.items.length);
  goStep(2);
}
function setActMood(m){ playClick(); state.quiz.mood=m; render(); }
function pickActivityList(){
  state.quiz.category='activity';
  state.quiz.itemIndex = Math.floor(Math.random()*CATS.activity.items.length);
  goStep(2);
}
function goStep(n){ state.quiz.step = n; render(); }

/* ---- shared suggestion card ---- */
function suggestionCard(){
  const q = state.quiz;
  const cat = CATS[q.category];
  const item = cat.items[q.itemIndex];
  const logoImg = item.logo && LOGOS[item.logo] ? `<img src="${LOGOS[item.logo]}" class="logo-badge">` : `<div style="font-size:38px;margin-bottom:8px;">${cat.emoji}</div>`;
  return `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;">
    <span class="sparkle" style="top:0;left:16px;">✨</span>
    <div class="washi" style="top:-6px;right:24px;"></div>
    <div class="paper-stack">
      <div class="front card" style="text-align:center;padding:26px 16px;">
        ${logoImg}
        <div class="h2">${item.name}</div>
        <div class="p" style="margin:0;">${cat.label}</div>
      </div>
    </div>
    <div class="row2" style="margin-top:18px;">
      <button class="btn ghost" onclick="reroll()">یکی دیگه</button>
      <button class="btn sun" onclick="confirmSuggestion(${q.itemIndex})">همینه! ✓</button>
    </div>
  </div>`;
}
function reroll(){
  playClick();
  const q = state.quiz;
  const items = CATS[q.category].items;
  if(items.length>1){
    let next;
    do{ next = Math.floor(Math.random()*items.length); }while(next===q.itemIndex);
    q.itemIndex = next;
  }
  render();
}
function confirmSuggestion(idx){
  const q = state.quiz;
  const item = CATS[q.category].items[idx];
  q.label = item.name; q.emoji = CATS[q.category].emoji; q.logo = item.logo;
  playConfirm();
  nav('predict');
}

/* ================= PREDICTION (fun moment before photo) ================= */
function viewPredict(){
  const q = state.quiz;
  const r = STAR_REACTIONS[q.predicted];
  const mood = r ? r.mood : 'neutral';
  const bubble = r ? r.text : 'یه عددی بزن ببینم چقدر شوقشو داری 👀';
  return `<div class="view" style="justify-content:center;align-items:center;text-align:center;">
    <div class="blob-wrap" id="tikoPredict" style="animation:${q.predicted?'popIn .3s ease':'floaty 3.4s ease-in-out infinite'};">${blobTikoMood(92,mood)}</div>
    <div class="card" style="padding:10px 16px;margin:6px 0 4px;display:inline-block;">
      <span style="font-size:13px;font-weight:700;">${bubble}</span>
    </div>
    <div class="h2" style="margin-top:14px;">پیش‌بینی می‌کنی چند ستاره بشه؟</div>
    <p class="p">${q.label} ${q.emoji||''} — بعداً می‌بینیم درست حدس زدی یا نه</p>
    <div class="stars" id="predictStars">
      ${[1,2,3,4,5].map(n=>`<span class="star ${n<=q.predicted?'on':''}" onclick="setPredict(${n})">⭐</span>`).join('')}
    </div>
    <button class="btn primary" ${!q.predicted?'disabled':''} onclick="goToPhoto()">بریم ثبتش کنیم 📸</button>
  </div>`;
}
function setPredict(n){ playClick(); state.quiz.predicted = n; render(); }
function goToPhoto(){ confetti(); playConfirm(); nav('photo'); }

/* ================= PHOTO CAPTURE ================= */
function viewPhoto(){
  const q = state.quiz;
  const slotDef = SLOTS.find(s=>s.key===q.slot);
  const photos = q.photos||[];
  const thumbs = photos.map((p,i)=>`
    <div style="position:relative;flex:0 0 auto;">
      <img src="${p}" style="width:78px;height:78px;object-fit:cover;border-radius:12px;box-shadow:0 6px 14px -8px rgba(0,0,0,.35);">
      <div onclick="removePhoto(${i})" style="position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;">✕</div>
    </div>`).join('');
  const addTile = `<div onclick="document.getElementById('fileInput').click()" style="flex:0 0 auto;width:78px;height:78px;border-radius:12px;border:1.6px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-soft);cursor:pointer;">＋</div>`;

  return `<div class="view">
    <div class="topbar">
      <div class="backbtn" onclick="back()">‹</div>
      <div class="topbar-title">${q.day} · ${slotDef.label}</div>
    </div>
    <div class="blob-wrap">${blobTiko(64,'celebrate')}</div>
    <div class="h2" style="text-align:center;">${q.label} ${q.emoji||''}</div>
    <p class="p" style="text-align:center;">یک یا چند عکس بفرست تا تسک کامل بشه</p>

    <div style="display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;">
      ${thumbs}${addTile}
    </div>

    <input type="file" accept="image/*" multiple id="fileInput" style="display:none" onchange="handlePhoto(this)">
    ${photos.length===0 ? `<button class="btn sky" onclick="document.getElementById('fileInput').click()">📷 از دوربین یا گالری اضافه کن</button>` : ''}

    ${photos.length>0 ? `
    <div style="margin-top:16px;">
      <div class="p" style="margin-bottom:6px;text-align:center;">واقعاً چند ستاره شد؟</div>
      <div class="stars" style="margin:4px 0 10px;">
        ${[1,2,3,4,5].map(n=>`<span class="star ${n<=q.actual?'on':''}" onclick="setActual(${n})" style="font-size:30px;">⭐</span>`).join('')}
      </div>
    </div>
    <div style="margin-top:6px;">
      <div class="p" style="margin-bottom:6px;">یه جمله خاطره؟ (اختیاری)</div>
      <input type="text" placeholder="مثلاً: خیلی خندیدیم :)" value="${q.note||''}" oninput="state.quiz.note=this.value">
    </div>
    <button class="btn primary" style="margin-top:16px;" onclick="finishTask()">تکمیل شد ✓</button>
    ` : ''}
  </div>`;
}
function setActual(n){ playClick(); state.quiz.actual = n; render(); }
function finishTask(){
  const q = state.quiz;
  state.week[q.day][q.slot] = {
    status:'done', label:q.label, emoji:q.emoji, logo:q.logo||null, photos:q.photos||[], note:q.note||'',
    predicted:q.predicted||0, actual:q.actual||0
  };
  saveWeek();
  confetti();
  playConfirm();
  toast('عالی شد! ثبت شد 🎉');
  state.currentDay = q.day;
  state.quiz = null;
  setTimeout(()=>{ state.view='day'; state.history=[]; render(); }, 550);
}

/* ================= ALBUM CONFIRM (the "is he leaving" moment) ================= */
function viewAlbumConfirm(){
  if(!state.albumAnswer){
    return `<div class="view" style="justify-content:center;align-items:center;text-align:center;">
      <div class="topbar" style="position:absolute;top:22px;right:20px;left:20px;">
        <div class="backbtn" onclick="back()">‹</div>
      </div>
      <div class="blob-wrap">${blobTikoMood(90,'neutral')}</div>
      <div class="h2">آرمان می‌خواد از پیشت بره؟</div>
      <p class="p">قبل از باز کردن آلبوم، بذار بدونیم چه حسی داریم</p>
      <div class="row2" style="margin-top:10px;">
        <button class="btn ghost" onclick="setAlbumAnswer('no')">نه هنوز 🙂</button>
        <button class="btn ghost" onclick="setAlbumAnswer('yes')">آره 🥲</button>
      </div>
    </div>`;
  }
  const yes = state.albumAnswer==='yes';
  const msg = yes
    ? 'می‌دونم سخته. ولی این چندروزی که با هم داشتین، واقعی بود و تو این آلبوم برای همیشه می‌مونه. دفعه‌ی بعد هم میاد 🤍'
    : 'خب پس هنوز وقت داری از این چندروز لذت ببری. بیا با هم مرور کنیم چیا رفته تو کارنامه‌ی این هفته 😊';
  return `<div class="view" style="justify-content:center;align-items:center;text-align:center;">
    <div class="blob-wrap">${blobTikoMood(90, yes?'meh':'good')}</div>
    <div class="card" style="padding:18px;margin-top:6px;">
      <p style="font-size:14px;line-height:2;margin:0;">${msg}</p>
    </div>
    <button class="btn primary" style="margin-top:20px;" onclick="nav('album')">برو آلبوم 📸</button>
  </div>`;
}
function setAlbumAnswer(a){ playClick(); state.albumAnswer=a; render(); }

/* ================= ALBUM (polaroid flip) ================= */
function getAllDoneSlides(){
  const slides = [];
  DAYS.forEach(day=>{
    SLOTS.forEach(sl=>{
      const d = state.week[day][sl.key];
      if(d && d.status==='done'){
        const photos = (d.photos && d.photos.length) ? d.photos : (d.photo ? [d.photo] : []);
        if(photos.length===0){ slides.push({day, slotLabel:sl.label, ...d, photo:null}); }
        else photos.forEach(p=>slides.push({day, slotLabel:sl.label, ...d, photo:p}));
      }
    });
  });
  return slides;
}
let albumIndex = 0;
let albumDir = 1;
function viewAlbum(){
  const slides = getAllDoneSlides();
  if(slides.length===0){
    return `<div class="view" style="justify-content:center;align-items:center;text-align:center;">
      <div class="topbar" style="position:absolute;top:22px;right:20px;left:20px;">
        <div class="backbtn" onclick="back()">‹</div>
      </div>
      <div style="font-size:38px;">💌</div>
      <div class="h2">هنوز آلبوم خالیه</div>
      <p class="p">اولین تسک رو تکمیل کن تا این‌جا خاطره‌ها جمع بشن</p>
    </div>`;
  }
  if(albumIndex>=slides.length) albumIndex=0;
  const s = slides[albumIndex];
  const dots = slides.map((_,i)=>`<div class="dot ${i===albumIndex?'on':''}"></div>`).join('');
  const ratingLine = (s.predicted||s.actual) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">پیش‌بینی: ${'⭐'.repeat(s.predicted||0)||'—'} &nbsp;|&nbsp; واقعی: ${'⭐'.repeat(s.actual||0)||'—'}</div>` : '';
  const rot = albumIndex%2===0 ? '-3deg' : '2.5deg';
  return `<div class="view">
    <div class="topbar">
      <div class="backbtn" onclick="back()">‹</div>
      <div class="topbar-title">آلبوم هفته (${slides.length} خاطره)</div>
    </div>
    <div style="display:flex;justify-content:center;">
      <div class="polaroid" key="${albumIndex}" style="transform:rotate(${rot});">
        <div class="polaroid-photo">
          ${s.photo?`<img src="${s.photo}">`:`<div class="photo-placeholder" style="height:100%;border-radius:0;">${blobAkso(50)}</div>`}
        </div>
        <div class="polaroid-caption">
          <div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);">${s.day} · ${s.slotLabel}</div>
          <div class="display" style="font-size:19px;margin-top:2px;">${s.label} ${s.emoji||''}</div>
          ${s.note?`<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">«${s.note}»</div>`:''}
          ${ratingLine}
        </div>
      </div>
    </div>
    <div class="dots">${dots}</div>
    <div class="row2" style="margin-top:16px;">
      <button class="btn ghost" onclick="albumNav(-1)">قبلی</button>
      <button class="btn ghost" onclick="albumNav(1)">بعدی</button>
    </div>
    <button class="btn primary" style="margin-top:10px;" onclick="downloadSlide()">⬇️ دانلود این عکس</button>
  </div>`;
}
function albumNav(dir){
  playClick();
  const slides = getAllDoneSlides();
  albumIndex = (albumIndex + dir + slides.length) % slides.length;
  render();
}
function downloadSlide(){
  const slides = getAllDoneSlides();
  const s = slides[albumIndex];
  if(!s || !s.photo){ toast('این خاطره عکس نداره'); return; }
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const cctx = canvas.getContext('2d');
    cctx.drawImage(img,0,0);
    const gradH = canvas.height*0.32;
    const grad = cctx.createLinearGradient(0, canvas.height-gradH, 0, canvas.height);
    grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.72)');
    cctx.fillStyle = grad;
    cctx.fillRect(0, canvas.height-gradH, canvas.width, gradH);
    cctx.fillStyle = '#fff';
    cctx.direction = 'rtl'; cctx.textAlign='right';
    cctx.font = `${Math.round(canvas.width*0.045)}px Vazirmatn, sans-serif`;
    cctx.fillText(`${s.label} ${s.emoji||''}`, canvas.width-24, canvas.height-30);
    cctx.font = `${Math.round(canvas.width*0.03)}px Vazirmatn, sans-serif`;
    cctx.fillText(`${s.day} · ${s.slotLabel}`, canvas.width-24, canvas.height-56);
    const link = document.createElement('a');
    link.download = `donafare-${s.day}-${s.slotLabel}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.9);
    link.click();
  };
  img.src = s.photo;
}

/* ================= INIT ================= */
loadState();
</script>
